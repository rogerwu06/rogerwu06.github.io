name: Remove obsolete wind compatibility option
on:
  push:
    paths:
      - '.github/workflows/remove-wind-compat.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch desktop wind file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('downloads/Wind Load Generation in STAAD Following Canadian NBCC 2020 Codes.py')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'\n# #\n# workbook compatibility option.*?\n# # #\nORIGINAL_COMPAT_MEMBER_TRIM = 5\n', '\n', s, flags=re.S)
          s = s.replace('    cg: float,\n    *,\n    exact_workbook_compatibility: bool = True,\n):', '    cg: float,\n):')
          s = re.sub(r'\n    filtered_members = members\n    if exact_workbook_compatibility and len\(filtered_members\) > ORIGINAL_COMPAT_MEMBER_TRIM:\n        filtered_members = filtered_members\[:-ORIGINAL_COMPAT_MEMBER_TRIM\]\n', '\n', s)
          s = s.replace(' in filtered_members:', ' in members:')

          old_menu = '''        self.exact_compatibility = tk.BooleanVar(value=True)\n        options = tk.Menu(menu, tearoff=False)\n        options.add_checkbutton(\n            label="Exact uploaded-workbook compatibility (omits its final 5 member rows)",\n            variable=self.exact_compatibility,\n            command=self.recalculate,\n        )\n        menu.add_cascade(label="Options", menu=options)\n        self.config(menu=menu)'''
          s = s.replace(old_menu, '        self.config(menu=menu)')

          s = s.replace('                cg,\n                exact_workbook_compatibility=self.exact_compatibility.get(),\n            )', '                cg,\n            )')
          s = re.sub(r'\n            mode = "exact uploaded-workbook compatibility" if self\.exact_compatibility\.get\(\) else "fixed: all member rows processed"\n            self\.status_text\.set\(\n                f"Max height: \{max_height:g\} m   \|   GZ groups: \{len\(gz\)\}   \|   GX groups: \{len\(gx\)\}   \|   \{mode\}"\n            \)', '\n            self.status_text.set(\n                f"Max height: {max_height:g} m   |   GZ groups: {len(gz)}   |   GX groups: {len(gx)}"\n            )', s)

          if 'exact_workbook_compatibility' in s or 'ORIGINAL_COMPAT_MEMBER_TRIM' in s or 'Exact uploaded-workbook compatibility' in s:
              raise SystemExit('Compatibility code still present')
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile "downloads/Wind Load Generation in STAAD Following Canadian NBCC 2020 Codes.py"
          git config user.name "RogerWu"
          git config user.email "wewf632@gmail.com"
          git add "downloads/Wind Load Generation in STAAD Following Canadian NBCC 2020 Codes.py"
          git commit -m "Remove obsolete wind compatibility option"
          git push
