name: Roughen inline comments
on:
  push:
    paths:
      - '.github/workflows/roughen-inline-comments.yml'
permissions:
  contents: write
jobs:
  update-inline-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update inline comments only
        run: python .github/scripts/roughen_inline_comments.py
      - name: Compile check STAAD files
        run: |
          python -m py_compile "downloads/Seismic Load Generation in STAAD Following Canadian NBCC 2020 Codes.py"
          python -m py_compile "downloads/Wind Load Generation in STAAD Following Canadian NBCC 2020 Codes.py"
      - name: Commit files
        run: |
          git config user.name "RogerWu"
          git config user.email "wewf632@gmail.com"
          git add downloads/*.py
          git commit -m "Simplify inline comments in downloadable scripts"
          git push
