name: Align desktop STAAD layouts
on:
  push:
    paths:
      - '.github/workflows/align-desktop-layouts.yml'
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply desktop layout patch
        run: python .tmp_align_desktop.py
      - name: Compile desktop Python files
        run: |
          python -m py_compile "downloads/Seismic Load Generation in STAAD Following Canadian NBCC 2020 Codes.py"
          python -m py_compile "downloads/Wind Load Generation in STAAD Following Canadian NBCC 2020 Codes.py"
      - name: Commit changes
        run: |
          git config user.name "RogerWu"
          git config user.email "wewf632@gmail.com"
          git add downloads/*.py
          git commit -m "Align downloadable STAAD GUIs with website layout"
          git push
